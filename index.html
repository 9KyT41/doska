<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ДОСКА</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='90' height='70' x='5' y='15' rx='8' fill='%238a5a2b'/><rect width='70' height='14' x='15' y='28' rx='3' fill='%23f3e9d2'/><rect width='70' height='14' x='15' y='48' rx='3' fill='%23f3e9d2'/><circle cx='50' cy='90' r='4' fill='%232b1d0e'/></svg>">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="themes/oak.css" id="theme">
</head>
<body>
  <div id="board" class="board">
    <div class="board-hint">Доска пуста.</div>
  </div>

  <script src="js/core/bus.js"></script>
  <script src="themes/registry.js"></script>
  <script src="sounds/registry.js"></script>
  <script src="js/systems/themes.js"></script>
  <script src="js/systems/sounds.js"></script>
  <script src="js/workflow/project.js"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/core/entity.js"></script>
  <script src="js/components/thought.js"></script>
  <script src="js/components/audio.js"></script>
  <script src="js/components/image.js"></script>
  <script src="js/systems/render.js"></script>
  <script src="js/systems/compose.js"></script>
  <script src="js/systems/graph.js"></script>
  <script src="js/systems/blocks.js"></script>
  <script src="js/systems/export.js"></script>
  <script src="js/systems/capture.js"></script>
  <script src="js/ui/menu.js"></script>
  <script>
    function blockMenu() {
      const items = [
        { label: 'Сгруппировать выделенное в блок…', action: function () {
            const t = prompt('Имя блока:', '');
            if (t === null) return;
            Blocks.groupSelection(t.trim() || 'Блок');
            Menu.setTree(buildTree());
          } },
        { label: 'Убрать выделенное из блока', action: function () {
            Blocks.removeSelectionFromBlock();
            Menu.setTree(buildTree());
          } }
      ];
      const bl = Blocks.list();
      if (bl.length) {
        items.push({ label: 'Добавить выделенное в блок', children: bl.map(b => ({
          label: b.title, action: function () { Blocks.addSelectionTo(b.id); } })) });
        items.push({ label: 'Удалить блок (ноды останутся)', children: bl.map(b => ({
          label: b.title, action: function () { Blocks.deleteBlock(b.id); Menu.setTree(buildTree()); } })) });
      }
      return items;
    }

    function buildTree() {
      return [
        { label: 'Файл', children: [
          { label: 'Создать проект', action: function () { Project.createNew(); } },
          { label: 'Открыть проект…', action: function () { Project.open(); } },
          { label: 'Сохранить',       action: function () { Project.save(false); } },
          { label: 'Сохранить как…',  action: function () { Project.saveAs(); } },
          { label: 'Переименовать проект…', action: function () { Project.rename(); } }
        ]},
        { label: 'Правка', children: [
          { label: 'Удалить выделенное (Del)', action: function () { Compose.deleteSelected(); } },
          { label: 'Удалить пустые ноды…',     action: function () { Compose.deleteEmpty(); } },
          { label: 'Вернуть из корзины (Ctrl+Z)', action: function () { Compose.restoreLast(); } },
          { label: 'Очистить корзину…',        action: function () { Compose.clearTrash(); } }
        ]},
        { label: 'Экспорт', children: Export.menuItems() },
        { label: 'Блок', children: blockMenu() },
        { label: 'Настройки', children: [
          { label: 'Тема', children: THEMES.map(function (t) {
              return { label: t.name, action: function () { Themes.apply(t.id); } };
            }) }
        ]}
      ];
    }

    Themes.init();
    Sounds.init();
    Render.init(document.getElementById('board'));
    Project.init();
    Compose.init();
    Graph.init();
    Blocks.init();
    Capture.init();
    Menu.init();
    Menu.setTree(buildTree());
  </script>
</body>
</html>
